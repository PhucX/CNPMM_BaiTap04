services:
  mongodb:
    image: mongo:latest
    container_name: urbanstep-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: urbanstep-backend
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/urbanstep
      - PORT=3000
      - NODE_ENV=production
      - AUTH_SECRET=urbanstep-dev-secret
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: urbanstep-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
